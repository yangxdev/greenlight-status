<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>greenlight-status</title>
    <!--
      Applies the stored theme BEFORE first paint, so a dark choice never flashes white. Blocking and inline on
      purpose. Keep in sync with src/lib/theme.ts: same key, and anything unrecognised means light.
    -->
    <script>
      try {
        var dark = localStorage.getItem('theme') === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0f100f' : '#ffffff';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
