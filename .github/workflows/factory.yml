# Factory: implements blueprint.md (mode "build") or addresses Inspector findings on an open
# Factory PR (mode "fix").
#
# Triggers:
#   repository_dispatch greenlight-build   from greenlight's factory-dispatch workflow
#   repository_dispatch greenlight-fix     from this repo's Inspector ({ pr, round })
#   workflow_dispatch                      by hand
#
# Security model: the AI job never shares a runner with GREENLIGHT_TOKEN.
#   prepare  (no AI)        resolve branch, fetch Inspector findings
#   agent    (AI, no PAT)   Claude edits and commits locally, and the commits leave as a git bundle
#   verify   (no secrets)   re-runs lint, test, build and audit on the bundle in a fresh runner
#   publish  (PAT, no AI)   guards protected files, pushes, opens the PR and reports to greenlight.
#                           It never runs repository code.
name: Factory

on:
  repository_dispatch:
    types: [greenlight-build, greenlight-fix]
  workflow_dispatch:
    inputs:
      mode:
        description: build (from blueprint) or fix (address Inspector findings on a PR)
        type: choice
        options: [build, fix]
        default: build
      pr:
        description: PR number (fix mode only)
        required: false

# One Factory run per product repo at a time. greenlight's factory-dispatch enforces one build overall.
concurrency:
  group: factory
  cancel-in-progress: false

permissions:
  contents: read

env:
  GREENLIGHT_REPO: ${{ github.event.client_payload.greenlight_repo || vars.GREENLIGHT_REPO }}
  GREENLIGHT_ISSUE: ${{ github.event.client_payload.issue || vars.GREENLIGHT_ISSUE }}
  MODE: ${{ github.event.action == 'greenlight-fix' && 'fix' || inputs.mode || 'build' }}
  PR: ${{ github.event.client_payload.pr || inputs.pr }}
  ROUND: ${{ github.event.client_payload.round || '?' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      base: ${{ steps.branch.outputs.base }}
    steps:
      - name: Check required secrets and context
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GREENLIGHT_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
        run: |
          missing=0
          for name in CLAUDE_CODE_OAUTH_TOKEN GREENLIGHT_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          if [ -z "$GREENLIGHT_REPO" ] || [ -z "$GREENLIGHT_ISSUE" ]; then
            echo "::error::GREENLIGHT_REPO / GREENLIGHT_ISSUE unknown (payload or repo variables)"; missing=1
          fi
          if [ "$MODE" = "fix" ] && [ -z "$PR" ]; then echo "::error::fix mode needs a PR number"; missing=1; fi
          exit "$missing"

      - name: Resolve branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = "build" ]; then
            echo "branch=factory/build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "base=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" >> "$GITHUB_OUTPUT"
          else
            read -r state head sha < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefName,headRefOid \
              --jq '[.state, .headRefName, .headRefOid] | @tsv')
            if [ "$state" != "OPEN" ] || [[ "$head" != factory/* ]]; then
              echo "::error::PR #$PR is not an open Factory PR (state=$state, branch=$head)"; exit 1
            fi
            echo "branch=$head" >> "$GITHUB_OUTPUT"
            echo "base=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest Inspector findings
        if: env.MODE == 'fix'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("greenlight:inspector verdict=fail")))] | last | .body // ""' \
            > "$RUNNER_TEMP/findings/findings.md"
          [ -s "$RUNNER_TEMP/findings/findings.md" ] || { echo "::error::No Inspector findings on PR #$PR"; exit 1; }

      - if: env.MODE == 'fix'
        uses: actions/upload-artifact@v7
        with:
          name: findings
          path: ${{ runner.temp }}/findings/findings.md
          retention-days: 3

  agent:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      claude: ${{ env.MODE == 'build' && steps.claude.outcome || steps.claude_fix.outcome }}
      commits: ${{ steps.bundle.outputs.commits }}
    env:
      BRANCH: ${{ needs.prepare.outputs.branch }}
      BASE: ${{ needs.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Prepare working branch
        run: |
          git config user.name "greenlight-factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

      - if: env.MODE == 'fix'
        uses: actions/download-artifact@v8
        with:
          name: findings
          path: .greenlight-run

      - name: Implement blueprint
        id: claude
        if: env.MODE == 'build'
        # Running out of turns fails this step; verify and publish still decide what ships.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are the Greenlight Factory. Build this product from its blueprint.

            1. Read CLAUDE.md (conventions, definition of done) and blueprint.md (the spec). Both are authoritative.
               Build the UI from src/components/shell and src/components/ui, following CLAUDE.md → "Look & feel" and the
               blueprint's Identity: replace the scaffold's content in src/App.tsx, keep its structure.
            2. Implement the blueprint's tasks in order. For each task:
               - write the code and the tests that cover that task's acceptance criteria;
               - run `npm run check` and fix until it passes;
               - commit only that task: `git add -A && git commit -m "task <n>: <short title>"`.
            3. Stay inside the blueprint's scope and non-goals. Do not edit blueprint.md, CLAUDE.md or anything under .github/.
               Do not try to push, open PRs, or call external services. Tests must not need the network.
            4. If you run low on turns, commit the finished tasks first. A partial but green build beats a broken full one.
            5. Fill in README.md (CLAUDE.md → "README"): every bracketed line, markers kept. Commit it:
               `git add README.md && git commit -m "docs: readme"`.
            6. Finally, write build-report.md at the repo root by filling in every section of .github/build-report.md.
               The greenlight issue is ${{ env.GREENLIGHT_REPO }}#${{ env.GREENLIGHT_ISSUE }} and the run is
               ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
               Then commit it: `git add build-report.md && git commit -m "docs: build report"`.
          claude_args: >-
            --max-turns ${{ vars.FACTORY_MAX_TURNS || '80' }}
            ${{ vars.CLAUDE_MODEL && format('--model {0}', vars.CLAUDE_MODEL) || '' }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm run:*),Bash(npm install:*),Bash(npm ci),Bash(npm audit:*),Bash(npx vitest:*),Bash(npx tsc:*),Bash(npx eslint:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git rm:*),Bash(git mv:*),Bash(ls:*),Bash(mkdir:*)"

      - name: Address Inspector findings
        id: claude_fix
        if: env.MODE == 'fix'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are the Greenlight Factory, fix round ${{ env.ROUND }} for PR #${{ env.PR }}.

            1. Read .greenlight-run/findings.md: the Inspector's failed checks and review findings for this branch.
            2. Read CLAUDE.md and blueprint.md. They are authoritative; the findings tell you where the build falls short.
            3. Fix every blocker. For failing checks, reproduce with the matching npm script first.
               If a task from blueprint.md is missing, implement it with tests.
            4. Run `npm run check` until it passes, then commit: `git add -A && git commit -m "fix: <what>"`
               (several commits are fine).
            5. Update build-report.md so it reflects the current state, and commit it.
            Do not edit blueprint.md, CLAUDE.md or anything under .github/. Do not push. Tests must not need the network.
          claude_args: >-
            --max-turns ${{ vars.FIX_MAX_TURNS || '40' }}
            ${{ vars.CLAUDE_MODEL && format('--model {0}', vars.CLAUDE_MODEL) || '' }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm run:*),Bash(npm install:*),Bash(npm ci),Bash(npm audit:*),Bash(npx vitest:*),Bash(npx tsc:*),Bash(npx eslint:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git rm:*),Bash(git mv:*),Bash(ls:*),Bash(mkdir:*)"

      - name: Bundle commits
        id: bundle
        run: |
          rm -rf .greenlight-run
          git add -A
          git diff --cached --quiet || git commit -m "chore: uncommitted factory changes"
          commits=$(git rev-list --count "$BASE..HEAD")
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "Factory produced $commits commit(s)"
          mkdir -p "$RUNNER_TEMP/bundle"
          if [ "$commits" -gt 0 ]; then git bundle create "$RUNNER_TEMP/bundle/factory.bundle" "$BASE..HEAD"; fi

      - if: steps.bundle.outputs.commits != '0'
        uses: actions/upload-artifact@v7
        with:
          name: factory-bundle
          path: ${{ runner.temp }}/bundle/factory.bundle
          retention-days: 7

  verify:
    needs: [prepare, agent]
    if: needs.agent.outputs.commits != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.check.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: factory-bundle
          path: ${{ runner.temp }}/bundle

      - name: Apply bundle
        run: |
          git bundle verify "$RUNNER_TEMP/bundle/factory.bundle"
          git fetch "$RUNNER_TEMP/bundle/factory.bundle" HEAD
          git checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Lint, test, build, audit
        id: check
        continue-on-error: true
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high

  no-output:
    needs: agent
    if: needs.agent.outputs.commits == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report empty run
        env:
          GH_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
          CLAUDE: ${{ needs.agent.outputs.claude }}
        run: |
          gh issue comment "$GREENLIGHT_ISSUE" --repo "$GREENLIGHT_REPO" \
            --body "🏭 **Factory ($MODE):** produced no commits (agent: $CLAUDE), so it needs a human. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue edit "$GREENLIGHT_ISSUE" --repo "$GREENLIGHT_REPO" --add-label stuck --remove-label building

  publish:
    needs: [prepare, agent, verify]
    if: always() && needs.agent.result == 'success' && needs.agent.outputs.commits != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: ${{ needs.prepare.outputs.branch }}
      BASE: ${{ needs.prepare.outputs.base }}
      COMMITS: ${{ needs.agent.outputs.commits }}
      CLAUDE: ${{ needs.agent.outputs.claude }}
      VERIFY: ${{ needs.verify.outputs.result || 'skipped' }}
      GH_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: factory-bundle
          path: ${{ runner.temp }}/bundle

      - name: Apply bundle and guard protected files
        run: |
          git bundle verify "$RUNNER_TEMP/bundle/factory.bundle"
          git fetch "$RUNNER_TEMP/bundle/factory.bundle" HEAD
          git checkout --detach FETCH_HEAD
          if [ "$(git merge-base "$BASE" HEAD)" != "$BASE" ]; then echo "::error::bundle is not based on $BASE"; exit 1; fi
          protected=$(git diff --name-only "$BASE..HEAD" | grep -E '^(\.github/|blueprint\.md$|CLAUDE\.md$)' || true)
          if [ -n "$protected" ]; then echo "::error::Factory modified protected files:"; echo "$protected"; exit 1; fi

      - name: Push branch
        run: |
          # Hooks disabled: nothing written during the build may run with the token.
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Open pull request
        if: env.MODE == 'build'
        run: |
          if [ -s build-report.md ]; then cp build-report.md "$RUNNER_TEMP/body.md"; else echo "_The Factory did not write a build report._" > "$RUNNER_TEMP/body.md"; fi
          draft=()
          title="Build from blueprint (${GREENLIGHT_REPO}#${GREENLIGHT_ISSUE})"
          if [ "$CLAUDE" != "success" ] || [ "$VERIFY" != "success" ]; then draft=(--draft); title="[incomplete] $title"; fi
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md" "${draft[@]}")
          gh issue comment "$GREENLIGHT_ISSUE" --repo "$GREENLIGHT_REPO" \
            --body "🏭 **Factory:** PR opened: ${url} (agent: ${CLAUDE}, checks: ${VERIFY}). The Inspector reviews it next."

      - name: Report fix round
        if: env.MODE == 'fix'
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "🏭 **Factory:** fix round ${ROUND} pushed ${COMMITS} commit(s) (agent: ${CLAUDE}, checks: ${VERIFY}). The Inspector re-runs on this push."

  report-failure:
    needs: [prepare, agent, verify, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report failure
        env:
          GH_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$GREENLIGHT_REPO" ] && [ -n "$GREENLIGHT_ISSUE" ] || exit 0
          gh issue comment "$GREENLIGHT_ISSUE" --repo "$GREENLIGHT_REPO" \
            --body "🏭 **Factory ($MODE):** run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue edit "$GREENLIGHT_ISSUE" --repo "$GREENLIGHT_REPO" --add-label stuck --remove-label building
